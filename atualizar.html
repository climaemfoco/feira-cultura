<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizando site…</title>
<style>
body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#071a15;color:white;text-align:center}
main{max-width:560px;padding:30px}
a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:white;color:#123;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Atualizando o site…</h1>
<p id="msg">Limpando versões antigas armazenadas neste navegador.</p>
<a id="go" href="index.html?v=12">Abrir V12</a>
</main>
<script>
(async function(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    localStorage.removeItem("clima-cache-version");
    document.getElementById("msg").textContent="Cache antigo removido. Agora abra a V12.";
  }catch(e){
    document.getElementById("msg").textContent="Abra a V12 pelo botão abaixo.";
  }
})();
</script>
</body>
</html>
